<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motivos 💙</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom, #87CEFA, #1E90FF);
        color: white;
        text-align: center;
    }

    .container {
        padding: 40px;
    }

    h1 {
        font-size: 2.5em;
        margin-bottom: 20px;
    }

    .card {
        background: rgba(255, 255, 255, 0.1);
        padding: 30px;
        border-radius: 20px;
        max-width: 600px;
        margin: 20px auto;
        backdrop-filter: blur(10px);
        font-size: 1.1em;
        line-height: 1.8em;
    }

    .heart {
        font-size: 2em;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }
</style>

</head>
<body>

<div class="container">

    <h1>Motivos para você ficar comigo 💙</h1>
    <div class="card">
        <p>
            Vou ser fiel a vc, gosto de ficar em casa, gosto de videogames,
            Sou palmeirense igual seu pai então eu ia me dar muito bem com ele,
            gosto de naruto,a cor azul também é uma das minhas favoritas; 
            gosto muuuuuuuito de você, eu e vc combina muito.
            

        </p>

        <p class="heart">💙</p>
    </div>

</div>

</body>
</html>
